# Deploy the Flutter web build to Firebase Hosting (live channel) on merge to main.
# Firebase's `init hosting:github` generates a bare `flutter …` step with no SDK
# install and drops this repo's index.auto→index.html copy; both are restored below.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
      - run: flutter pub get
      - run: flutter pub run build_runner build --delete-conflicting-outputs
      - run: flutter test
      # This repo serves web/index.auto as index.html (see the manual build flow).
      - run: cp web/index.auto web/index.html
      - run: flutter build web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOMAIN_VISUALISER_APP }}
          channelId: live
          projectId: domain-visualiser-app
